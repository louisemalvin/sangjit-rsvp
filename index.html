<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wedding Ceremony RSVP</title>

    <!-- Open Graph -->
    <meta property="og:title" content="Wedding Ceremony RSVP">
    <meta property="og:image" content="https://rsvp.ltanaka.me/invitation.jpeg">
    <meta property="og:image:width" content="1429">
    <meta property="og:image:height" content="2001">
    <meta property="og:url" content="https://rsvp.ltanaka.me">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Wedding Ceremony RSVP">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Wedding Ceremony RSVP">
    <meta name="twitter:image" content="https://rsvp.ltanaka.me/invitation.jpeg">

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500;1,600;1,700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #1a4a1a;
            font-family: 'Cormorant Garamond', serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .invitation-section {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 32px 16px;
        }

        .invitation-section img {
            width: 100%;
            max-width: 650px;
            height: auto;
            border-radius: 6px;
            box-shadow: 0 4px 40px rgba(0, 0, 0, 0.35);
        }

        .form-section iframe {
            width: 100%;
            height: 100vh;
            border: none;
            display: block;
        }

        @media (max-width: 650px) {
            .invitation-section {
                padding: 16px 12px;
            }

            .invitation-section img {
                border-radius: 4px;
            }

            .form-section iframe {
                height: 100dvh;
            }
        }
    </style>
</head>
<body>
    <div class="invitation-section">
        <img src="invitation.jpeg" alt="Wedding Invitation">
    </div>
    <div class="form-section">
        <iframe id="rsvp-form" title="Wedding RSVP" allow="payment"></iframe>
    </div>

    <script>
        (function () {
            var params = new URLSearchParams(window.location.search);
            var name = params.get('n');
            var base = 'https://ltanaka.fillout.com/wedding-rsvp';
            var src = name ? base + '?n=' + encodeURIComponent(name) : base;
            document.getElementById('rsvp-form').src = src;
        })();
    </script>
</body>
</html>
